project(':jneuro') {
    def guiPython = providers.gradleProperty('guiPython').getOrElse(System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('windows') ? 'python' : 'python3')
    tasks.named('test') {
        useJUnitPlatform { excludeTags 'gui', 'cuda', 'native-small' }
    }
    def verifyCudaResources = tasks.register('verifyCudaResources', Exec) {
        group = 'verification'
        description = 'Checks packaged CUDA PTX source, compiler provenance and ABI without requiring CUDA.'
        commandLine guiPython, file('tools/build_cuda.py'), 'verify'
    }
    def cudaResourceVerifierTest = tasks.register('cudaResourceVerifierTest', Exec) {
        group = 'verification'
        environment 'PYTHONDONTWRITEBYTECODE', '1'
        commandLine guiPython, '-m', 'unittest', 'discover', '-s', file('tools'), '-p', 'test_*.py'
    }
    tasks.named('check') { dependsOn verifyCudaResources, cudaResourceVerifierTest }
    tasks.register('gpuCheck', Test) {
        group = 'verification'
        description = 'Verifies CUDA training on a real NVIDIA GPU; absence or driver failure is an error.'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags 'cuda' }
        systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
        maxParallelForks = 1
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
        reports.junitXml.required = true
        reports.html.required = true
        testLogging.showStandardStreams = true
    }
    tasks.register('nativeSmallCheck', Test) {
        group = 'verification'
        description = 'Requires the experimental native SMALL library and checks actual scalar/AVX2 parity.'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags 'native-small' }
        systemProperty 'jneuro.small.native', providers.gradleProperty('neuroSmallNative').orElse('').get()
        outputs.upToDateWhen { false }
        maxParallelForks = 1
    }
    tasks.register('cudaTest') {
        group = 'verification'
        description = 'Compatibility alias for hardware-required CUDA and cuBLAS acceptance.'
        dependsOn tasks.named('gpuCheck')
    }
    tasks.register('smallExperiments', JavaExec) {
        group = 'verification'
        description = 'Measures independent-model cohorts and paired-seed exact/approximate convergence.'
        dependsOn tasks.named('jmhClasses')
        classpath = sourceSets.jmh.runtimeClasspath
        mainClass = 'com.lis.neuro.SmallTrainingExperiments'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(27) }
        jvmArgs '-Xms128m', '-Xmx2g'
        systemProperty 'jneuro.benchmark.sourceRevision', providers.gradleProperty('neuroBenchmarkRevision').orElse('unspecified').get()
        if (providers.gradleProperty('neuroSmallNative').isPresent()) systemProperty 'jneuro.small.native', providers.gradleProperty('neuroSmallNative').get()
    }
    tasks.register('architectureSearchBenchmark', JavaExec) {
        group = 'verification'
        description = 'Measures complete Spiral architecture searches, fixed manifests and full-budget quality.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.lis.neuro.ArchitectureSearchBenchmark'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(27) }
        jvmArgs '-Xms128m', '-Xmx2g'
        systemProperty 'jneuro.benchmark.sourceRevision', providers.gradleProperty('neuroBenchmarkRevision').orElse('unspecified').get()
    }
    ['cudaBenchmark', 'cpuGpuBenchmark'].each { benchmarkTask ->
        tasks.register(benchmarkTask, JavaExec) {
            group = 'verification'
            description = 'Compares CPU matrix training with CUDA/cuBLAS FP64 and FP32.'
            classpath = sourceSets.main.runtimeClasspath
            mainClass = 'com.lis.neuro.NeuroCudaTrainingBenchmark'
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(27) }
            jvmArgs '--enable-native-access=ALL-UNNAMED', '-Xms128m', '-Xmx2g'
            systemProperty 'jneuro.benchmark.sourceRevision', providers.gradleProperty('neuroBenchmarkRevision').orElse('unspecified').get()
            if (providers.gradleProperty('neuroSmallNative').isPresent()) systemProperty 'jneuro.small.native', providers.gradleProperty('neuroSmallNative').get()
        }
    }
    def guiTest = tasks.register('guiTest', Test) {
        group = 'verification'
        description = 'Tests real JNeuro windows with native mouse/keyboard input; requires a display.'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags 'gui' }
        systemProperty 'java.awt.headless', 'false'
        systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
        systemProperty 'user.language', 'en'
        systemProperty 'user.country', 'US'
        systemProperty 'gui.screenshots', layout.buildDirectory.dir('screenshots/gui').get().asFile.absolutePath
        maxParallelForks = 1
        maxHeapSize = '1g'
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
        doFirst {
            delete layout.buildDirectory.dir('screenshots/gui').get().asFile
            delete layout.buildDirectory.dir('test-results/guiTest').get().asFile
        }
        reports.junitXml.required = true
        reports.html.required = true
    }
    def guiPathVerifierTest = tasks.register('guiPathVerifierTest', Exec) {
        group = 'verification'
        workingDir file('scripts')
        commandLine guiPython, '-m', 'unittest', 'test_gui_paths.py'
    }
    def guiPathCoverage = tasks.register('guiPathCoverage', Exec) {
        group = 'verification'
        dependsOn guiTest, guiPathVerifierTest
        commandLine guiPython, file('scripts/verify_gui_paths.py'), '--catalog', file('GUI_PATHS.md'),
                '--reports', layout.buildDirectory.dir('test-results/guiTest').get().asFile,
                '--output', layout.buildDirectory.file('reports/gui-paths/coverage.json').get().asFile
    }
    def guiCoverageReport = tasks.register('guiCoverageReport', org.gradle.testing.jacoco.tasks.JacocoReport) {
        dependsOn guiTest
        executionData(guiTest.map { it.extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension).destinationFile })
        sourceDirectories.setFrom(files('src/main/kotlin'))
        classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect {
            fileTree(dir: it, includes: ['**/NeuroXorCanvas*', '**/ArchitectureSearchPanel*', '**/NeuronGallery*', '**/NumericInputs*'])
        }))
        reports { xml.required = true; html.required = true }
    }
    tasks.register('guiCheck') {
        group = 'verification'
        description = 'Runs real-window tests and enforces at least 90% of registered UI paths.'
        dependsOn guiTest, guiPathCoverage, guiCoverageReport
    }
}
