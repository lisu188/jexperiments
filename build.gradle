project(':jneuro') {
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'org.jetbrains.kotlin.kapt'
    sourceSets {
        jmh {
            kotlin.srcDir 'src/jmh/kotlin'
            compileClasspath += sourceSets.main.output
            runtimeClasspath += output + compileClasspath
        }
    }

    configurations {
        jmhImplementation.extendsFrom implementation
        jmhRuntimeOnly.extendsFrom runtimeOnly
    }

    dependencies {
        implementation 'com.formdev:flatlaf:3.7.2'
        jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
        kaptJmh 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
        jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(27)
        }
        sourceCompatibility = JavaVersion.VERSION_26
        targetCompatibility = JavaVersion.VERSION_26
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 26
        options.compilerArgs += ['--add-modules', 'jdk.incubator.vector', '-Xlint:all,-incubating', '-Werror']
    }

    kotlin {
        jvmToolchain(27)
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_26)
            languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_4)
            apiVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_4)
            allWarningsAsErrors.set(true)
            freeCompilerArgs.add('-Xadd-modules=jdk.incubator.vector')
        }
    }

    kapt {
        correctErrorTypes = true
    }

    def java27 = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(27)
    }

    tasks.withType(JavaExec).configureEach {
        jvmArgs '--add-modules', 'jdk.incubator.vector', '--enable-native-access=ALL-UNNAMED'
        def interactive = name in ['runXorCanvas', 'runExperiment']
        systemProperty 'jneuro.log.level', providers.gradleProperty('neuroLogLevel').orElse(providers.environmentVariable('JNEURO_LOG_LEVEL')).orElse(interactive ? 'INFO' : 'WARN').get()
        systemProperty 'jneuro.log.file', providers.gradleProperty('neuroLogFile').orElse(providers.environmentVariable('JNEURO_LOG_FILE')).orElse(interactive ? 'true' : 'false').get()
        ['neuroLogDir': 'dir', 'neuroLogLimitBytes': 'limit_bytes', 'neuroLogCount': 'count'].each { key, suffix ->
            if (providers.gradleProperty(key).isPresent()) systemProperty "jneuro.log.${suffix}", providers.gradleProperty(key).get()
        }
    }

    tasks.withType(Test).configureEach {
        jvmArgs '--add-modules', 'jdk.incubator.vector', '--enable-native-access=ALL-UNNAMED'
        systemProperty 'java.awt.headless', 'true'
        systemProperty 'jneuro.log.level', providers.gradleProperty('neuroLogLevel').orElse('WARN').get()
        systemProperty 'jneuro.log.file', 'false'
        javaLauncher = java27
    }

    tasks.register('runExperiment', JavaExec) {
        group = 'application'
        description = 'Runs the JNeuro usage example.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.lis.neuro.NeuroExample'
        javaLauncher = java27
    }

    tasks.register('runXorCanvas', JavaExec) {
        group = 'application'
        description = 'Runs the Kotlin JNeuro Neural Learning Studio.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.lis.neuro.NeuroXorCanvas'
        javaLauncher = java27
    }

    tasks.register('renderStudio', JavaExec) {
        group = 'verification'
        description = 'Renders all seven implemented Swing studio views without a display.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.lis.neuro.NeuroXorCanvas'
        javaLauncher = java27
        systemProperty 'java.awt.headless', 'true'
        args "--screenshots=${layout.buildDirectory.dir('screenshots').get().asFile.absolutePath}"
    }

    tasks.register('migrationParity', JavaExec) {
        group = 'verification'
        description = 'Compares Kotlin inference and training against the pinned Java baseline.'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'com.lis.neuro.NeuroMigrationParity'
        javaLauncher = java27
        args providers.gradleProperty('neuroJavaBaseline').orElse(
                layout.buildDirectory.dir('migration-baseline/classes').get().asFile.absolutePath).get()
    }

    tasks.register('verifyExperiment', JavaExec) {
        group = 'verification'
        description = 'Runs deterministic JNeuro correctness verification.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.lis.neuro.NeuroVerification'
        javaLauncher = java27
    }

    tasks.register('benchmarkExperiment', JavaExec) {
