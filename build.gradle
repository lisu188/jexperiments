configure(javaModules + [project(':blogsite')]) {
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = '0.8.15'
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:6.1.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    sourceSets {
        test {
            java.srcDir rootProject.file('test-support/src/test/java')
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'coverage.smokeMains', coverageSmokeMains.get(project.name, '')
    }

    def exclusions = coverageExcludes.get(project.name, [])

    tasks.named('jacocoTestReport') {
        dependsOn tasks.named('test')
        reports {
            xml.required = true
            html.required = true
        }
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: exclusions)
        }))
    }

    tasks.named('jacocoTestCoverageVerification') {
        dependsOn tasks.named('test')
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: exclusions)
        }))
        violationRules {
            rule {
                limit {
                    counter = 'LINE'
                    value = 'COVEREDRATIO'
                    minimum = 0.90
                }
            }
        }
    }

    tasks.named('check') {
        dependsOn tasks.named('jacocoTestCoverageVerification')
    }
}

tasks.register('coverageVerification') {
    group = 'verification'
    description = 'Verifies at least 90% line coverage independently in every Gradle module.'
    dependsOn (javaModules + [project(':blogsite')]).collect {
        it.tasks.named('jacocoTestCoverageVerification')
    }
}

