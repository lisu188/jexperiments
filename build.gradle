plugins {
    id 'base'
    id 'org.springframework.boot' version '4.0.6' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.3.0' apply false
}

allprojects {
    group = 'experiments'
    version = '1.0-SNAPSHOT'
}

ext.moduleArchives = [
    bcel                 : 'BCEL',
    completeablefuture  : 'CompleteAbleFuture',
    distributedthreadpool: 'DistributedThreadPool',
    evolution            : 'Evolution',
    flowpublisher        : 'FlowPublisher',
    hashlife             : 'HashLife',
    javakotlinbridges    : 'JavaKotlinBridges',
    jneuro               : 'JNeuro',
    kotlindatasynthetic  : 'KotlinDataSynthetic',
    kotlindefaultargs    : 'KotlinDefaultArgs',
    kotlindelegation     : 'KotlinDelegation',
    kotlininlinecapture  : 'KotlinInlineCapture',
    kotlinmetadatareader : 'KotlinMetadataReader',
    kotlinpropertyrefs   : 'KotlinPropertyRefs',
    kotlinsamfuninterface: 'KotlinSamFunInterface',
    kotlinsealedwhen     : 'KotlinSealedWhen',
    kotlinsuspendstate   : 'KotlinSuspendState',
    kotlinvalueclassboxing: 'KotlinValueClassBoxing',
    lambdabytecode       : 'LambdaBytecode',
    observableconcurrenttree: 'ObservableConcurrentTree',
    orderedthreadpoolexecutor: 'OrderedThreadPoolExecutor',
    picontroller         : 'PiController',
    slickproject         : 'SlickGame',
    soapserver           : 'SoapServer',
    webaspect            : 'WebAspect'
]

def moduleArchives = ext.moduleArchives
def javaModules = moduleArchives.keySet().collect { project(":$it") }

configure(javaModules) {
    apply plugin: 'java'

    base {
        archivesName = moduleArchives[project.name]
    }

    java {
        sourceCompatibility = JavaVersion.toVersion(9)
        targetCompatibility = JavaVersion.toVersion(9)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    sourceSets {
        main {
            resources {
                srcDir 'src/main/java'
                exclude '**/*.java'
            }
        }
    }
}

configure([project(':soapserver'), project(':webaspect')]) {
    apply plugin: 'war'
}

def kotlinBytecodeMainClasses = [
    javakotlinbridges    : 'experiments.kotlin.bridges.BridgeExperimentKt',
    kotlindatasynthetic  : 'experiments.kotlin.datasynthetic.DataSyntheticExperimentKt',
    kotlindefaultargs    : 'experiments.kotlin.defaultargs.DefaultArgsExperimentKt',
    kotlindelegation     : 'experiments.kotlin.delegation.DelegationExperimentKt',
    kotlininlinecapture  : 'experiments.kotlin.inlinecapture.InlineCaptureExperimentKt',
    kotlinmetadatareader : 'experiments.kotlin.metadatareader.MetadataReaderExperiment',
    kotlinpropertyrefs   : 'experiments.kotlin.propertyrefs.PropertyRefsExperimentKt',
    kotlinsamfuninterface: 'experiments.kotlin.samfuninterface.SamFunInterfaceExperimentKt',
    kotlinsealedwhen     : 'experiments.kotlin.sealedwhen.SealedWhenExperimentKt',
    kotlinsuspendstate   : 'experiments.kotlin.suspendstate.SuspendStateExperimentKt',
    kotlinvalueclassboxing: 'experiments.kotlin.valueclassboxing.ValueClassBoxingExperimentKt'
]

configure(kotlinBytecodeMainClasses.keySet().collect { project(":$it") }) {
    apply plugin: 'org.jetbrains.kotlin.jvm'

    kotlin {
        jvmToolchain(17)
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_9)
        }
    }
}

kotlinBytecodeMainClasses.each { moduleName, mainClassName ->
    project(":$moduleName") {
        tasks.register('runExperiment', JavaExec) {
            group = 'application'
            description = "Runs the ${moduleArchives[moduleName]} bytecode experiment."
            classpath = sourceSets.main.runtimeClasspath
            mainClass = mainClassName
        }
    }
}

project(':observableconcurrenttree') {
    sourceSets {
        jcstress {
            java.srcDir 'src/jcstress/java'
            compileClasspath += sourceSets.main.output
            runtimeClasspath += output + compileClasspath
        }
    }

    configurations {
        jcstressImplementation.extendsFrom implementation
        jcstressRuntimeOnly.extendsFrom runtimeOnly
    }

    dependencies {
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'

        testImplementation platform('org.junit:junit-bom:6.1.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        jcstressImplementation 'org.openjdk.jcstress:jcstress-core:0.16'
        jcstressAnnotationProcessor 'org.openjdk.jcstress:jcstress-core:0.16'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(27)
        }
        sourceCompatibility = JavaVersion.VERSION_27
        targetCompatibility = JavaVersion.VERSION_27
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 27
        options.compilerArgs += ['-Xlint:all', '-Werror']
    }

    def java27 = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(27)
    }

    tasks.register('runExperiment', JavaExec) {
        group = 'application'
        description = 'Runs the ObservableConcurrentTree usage examples.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'ObservableConcurrentTreeExample'
        javaLauncher = java27
    }

    tasks.register('verifyExperiment', JavaExec) {
        group = 'verification'
        description = 'Runs deterministic ObservableConcurrentTree verification.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'ObservableConcurrentTreeVerification'
        javaLauncher = java27
    }

    tasks.named('test') {
        useJUnitPlatform {
            excludeTags 'massive', 'soak'
        }
        javaLauncher = java27
        maxHeapSize = '2g'
        testLogging {
            events 'failed'
            exceptionFormat = 'full'
        }
    }

    tasks.register('massiveTest', Test) {
        group = 'verification'
        description = 'Runs massive parallel ObservableConcurrentTree stress tests.'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        javaLauncher = java27
        maxHeapSize = providers.gradleProperty('treeMassiveHeap').orElse('3g').get()
        useJUnitPlatform {
            includeTags 'massive'
        }
        systemProperty 'tree.massive.addTasks',
                providers.gradleProperty('treeMassiveAddTasks').orElse('100000').get()
        systemProperty 'tree.massive.readerTasks',
                providers.gradleProperty('treeMassiveReaderTasks').orElse('5000').get()
        systemProperty 'tree.massive.writerTasks',
                providers.gradleProperty('treeMassiveWriterTasks').orElse('500').get()
        systemProperty 'tree.massive.opsPerWriter',
                providers.gradleProperty('treeMassiveOpsPerWriter').orElse('40').get()
        systemProperty 'tree.massive.loadReaders',
                providers.gradleProperty('treeMassiveLoadReaders').orElse('250').get()
    }

    tasks.register('soakTest', Test) {
        group = 'verification'
        description = 'Runs long-running ObservableConcurrentTree soak tests.'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        javaLauncher = java27
        maxHeapSize = providers.gradleProperty('treeSoakHeap').orElse('4g').get()
        useJUnitPlatform {
            includeTags 'soak'
        }
        systemProperty 'tree.soak.seconds',
                providers.gradleProperty('treeSoakSeconds').orElse('60').get()
        systemProperty 'tree.soak.workers',
                providers.gradleProperty('treeSoakWorkers').orElse('2000').get()
        systemProperty 'tree.soak.initialNodes',
                providers.gradleProperty('treeSoakInitialNodes').orElse('100000').get()
    }

    tasks.register('benchmarkExperiment', JavaExec) {
        group = 'verification'
        description = 'Runs the ObservableConcurrentTree microbenchmark harness.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'ObservableConcurrentTreeBenchmark'
        javaLauncher = java27
        jvmArgs = ['-Xms1g', '-Xmx1g']
    }

    tasks.register('benchmarkMatrixExperiment', JavaExec) {
        group = 'verification'
        description = 'Runs topology and operation performance matrix benchmarks.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'ObservableConcurrentTreePerformanceMatrix'
        javaLauncher = java27
        jvmArgs = ['-Xms2g', '-Xmx2g']
        args providers.gradleProperty('treeBenchmarkNodes').orElse('100000').get(),
                providers.gradleProperty('treeBenchmarkRepetitions').orElse('3').get()
    }

    tasks.register('jcstress', JavaExec) {
        group = 'verification'
        description = 'Runs jcstress Java Memory Model tests for ObservableConcurrentTree.'
        dependsOn tasks.named('jcstressClasses')
        classpath = sourceSets.jcstress.runtimeClasspath
        mainClass = 'org.openjdk.jcstress.Main'
        javaLauncher = java27
        args '-m', providers.gradleProperty('treeJcstressMode').orElse('quick').get(),
                '-t', 'experiments.observable.jcstress.*'
    }

    tasks.named('check') {
        dependsOn tasks.named('verifyExperiment')
        dependsOn tasks.named('test')
    }
}

project(':orderedthreadpoolexecutor') {
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(27)
        }
        sourceCompatibility = JavaVersion.VERSION_27
        targetCompatibility = JavaVersion.VERSION_27
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 27
        options.compilerArgs += ['-Xlint:all', '-Werror']
    }

    def java27 = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(27)
    }

    tasks.register('runExperiment', JavaExec) {
        group = 'application'
        description = 'Runs the OrderedThreadPoolExecutor usage examples.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.lis.threadpool.OrderedThreadPoolExecutorExample'
        javaLauncher = java27
    }

    tasks.register('verifyExperiment', JavaExec) {
        group = 'verification'
        description = 'Runs deterministic OrderedThreadPoolExecutor verification.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.lis.threadpool.OrderedThreadPoolExecutorVerification'
        javaLauncher = java27
    }

    tasks.register('benchmarkExperiment', JavaExec) {
        group = 'verification'
        description = 'Runs the OrderedThreadPoolExecutor benchmark harness.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.lis.threadpool.OrderedThreadPoolExecutorBenchmark'
        javaLauncher = java27
        jvmArgs = ['-Xms1g', '-Xmx1g']
    }

    tasks.named('check') {
        dependsOn tasks.named('verifyExperiment')
    }
}

project(':bcel') {
    dependencies {
        implementation 'org.apache.bcel:bcel:5.2'
    }
}

project(':picontroller') {
    dependencies {
        implementation 'org.apache.tomcat.embed:tomcat-embed-core:8.0.23'
        implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:8.0.23'
        implementation 'org.apache.logging.log4j:log4j-core:2.5'
        implementation 'com.pi4j:pi4j-core:1.0'
    }
}

project(':slickproject') {
    dependencies {
        implementation 'org.slick2d:slick2d-core:1.0.2'
    }
}

project(':soapserver') {
    dependencies {
        implementation 'org.apache.tomcat.embed:tomcat-embed-core:8.0.23'
        implementation 'javax.xml.soap:javax.xml.soap-api:1.4.0'
        runtimeOnly 'com.sun.xml.messaging.saaj:saaj-impl:1.5.3'
    }
}

project(':webaspect') {
    dependencies {
        implementation 'org.apache.tomcat.embed:tomcat-embed-core:8.0.23'
    }
}

project(':blogsite') {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'

    base {
        archivesName = 'ExperimentBlogSite'
    }

    java {
        sourceCompatibility = JavaVersion.toVersion(17)
        targetCompatibility = JavaVersion.toVersion(17)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    dependencies {
        implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.6')
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
        implementation 'org.commonmark:commonmark:0.28.0'

        testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.0.6')
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    def blogContentDir = layout.buildDirectory.dir('generated/blog-content')
    def blogFiles = moduleArchives.keySet().collect { rootProject.file("${it}/BLOG.md") }

    tasks.register('generateBlogContent') {
        inputs.files(blogFiles)
        outputs.dir(blogContentDir)

        doLast {
            def contentRoot = blogContentDir.get().asFile
            def postsDir = new File(contentRoot, 'blog-posts')
            project.delete(contentRoot)
            postsDir.mkdirs()

            def manifest = new File(postsDir, 'manifest.tsv')
            manifest.withWriter('UTF-8') { writer ->
                moduleArchives.each { moduleName, archiveName ->
                    def source = rootProject.file("${moduleName}/BLOG.md")
                    def target = new File(postsDir, "${moduleName}.md")
                    target.text = source.getText('UTF-8')
                    writer.write("${moduleName}\t${archiveName}\tblog-posts/${moduleName}.md\n")
                }
            }
        }
    }

    tasks.named('processResources') {
        dependsOn tasks.named('generateBlogContent')
        from(blogContentDir)
    }
}
