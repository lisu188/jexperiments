name: Import verified adaptive search

on:
  push:
    branches: [feature/jneuro-adaptive-search]
    paths: ['.github/workflows/neuro-adaptive-import.yml']

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/feature/jneuro-adaptive-search'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/jneuro-adaptive-search
      - name: Apply verified changes and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import lzma
          encoded = ''.join(Path(f'.github/neuro-adaptive-{i}.b64').read_text() for i in range(2))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '1ed3594a2bf3fb6aeb7a41a3a583316fe86457323b19913c71363964d30acaa1'
          Path('/tmp/neuro-adaptive.patch').write_bytes(patch)
          PY
          git apply --check /tmp/neuro-adaptive.patch
          git apply --index /tmp/neuro-adaptive.patch
          git rm .github/neuro-adaptive-0.b64 .github/neuro-adaptive-1.b64 .github/workflows/neuro-adaptive-import.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Guide architecture search by evolving completed Pareto leaders'
          git push origin HEAD:refs/heads/feature/jneuro-adaptive-search
