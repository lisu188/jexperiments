name: JNeuro Java 27

on:
  push:
    branches: [main]
    paths:
      - 'jneuro/**'
      - 'build.gradle'
      - '.github/workflows/jneuro.yml'
  pull_request:
    paths:
      - 'jneuro/**'
      - 'build.gradle'
      - '.github/workflows/jneuro.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify JNeuro
        run: ./gradlew --no-daemon :jneuro:check
      - name: JMH smoke
        run: ./gradlew --no-daemon :jneuro:jmhSmoke
      - name: Performance matrix smoke
        run: ./gradlew --no-daemon :jneuro:performanceMatrix -PneuroMatrixIterations=1000 -PneuroMatrixEpochs=2
      - name: Run example
        run: ./gradlew --no-daemon :jneuro:runExperiment
