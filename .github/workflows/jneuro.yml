name: JNeuro Kotlin 2.4.20 / Java 27

on:
  push:
    branches: [main]
    paths:
      - 'jneuro/**'
      - 'build.gradle'
      - 'AGENTS.md'
      - '.github/workflows/jneuro.yml'
  pull_request:
    paths:
      - 'jneuro/**'
      - 'build.gradle'
      - 'AGENTS.md'
      - '.github/workflows/jneuro.yml'

permissions:
  contents: read

concurrency:
  group: jneuro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require Kotlin application and test sources
        shell: bash
        run: |
          set -euo pipefail
          # Java benchmark drivers exercise the public JVM API and JMH processor.
          test -z "$(find jneuro/src/main jneuro/src/test -name '*.java' -print -quit)"
          test -f jneuro/src/main/kotlin/com/lis/neuro/Neuro.kt
          test -f jneuro/src/jmh/kotlin/com/lis/neuro/NeuroInferenceJmhBenchmark.kt
      - name: Verify JNeuro and coverage
        run: ./gradlew --no-daemon :jneuro:check :jneuro:jacocoTestReport
      - name: Render implemented studio views
        run: ./gradlew --no-daemon :jneuro:renderStudio
      - name: JMH smoke
        run: ./gradlew --no-daemon :jneuro:jmhSmoke
      - name: JMH inference comparison
        run: ./gradlew --no-daemon :jneuro:jmhCompare
      - name: JMH batch comparison
        run: ./gradlew --no-daemon :jneuro:jmhBatchCompare
      - name: JMH training comparison
        run: ./gradlew --no-daemon :jneuro:jmhTrainingCompare
      - name: Performance matrix smoke
        run: ./gradlew --no-daemon :jneuro:performanceMatrix -PneuroMatrixIterations=1000 -PneuroMatrixEpochs=2
      - name: Run example
        run: ./gradlew --no-daemon :jneuro:runExperiment
      - name: Upload validation reports and studio screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jneuro-kotlin-validation
          path: |
            jneuro/build/reports/**
            jneuro/build/screenshots/**
          if-no-files-found: ignore
          retention-days: 14

  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual desktop
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth openbox
      - name: Verify real GUI paths
        run: >-
          xvfb-run -a -s '-screen 0 1920x1200x24'
          bash -c 'openbox --config-file jneuro/scripts/gui-openbox.xml >/tmp/jneuro-openbox.log 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; ./gradlew --no-daemon :jneuro:guiCheck'
      - name: Upload GUI reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jneuro-gui-validation
          path: |
            jneuro/build/reports/**
            jneuro/build/test-results/guiTest/**
            jneuro/build/screenshots/gui/**
          if-no-files-found: error
          retention-days: 14
