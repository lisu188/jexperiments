name: Import verified JNeuro GUI changes

on:
  push:
    branches: [test/jneuro-gui-regressions]
    paths: ['.github/workflows/jneuro-gui-import.yml']

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/test/jneuro-gui-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/jneuro-gui-regressions
      - name: Apply exact verified patch and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import lzma
          encoded = ''.join(Path(f'.github/jneuro-gui-patch-{i}.b64').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b8385a0a7e32b6b44c10e0fbe251b302d277364db3e44cfa95df8090459fd0da'
          Path('/tmp/jneuro-gui.patch').write_bytes(patch)
          PY
          git apply --check /tmp/jneuro-gui.patch
          git apply --index /tmp/jneuro-gui.patch
          git rm .github/jneuro-gui-patch-{0,1,2,3}.b64 .github/workflows/jneuro-gui-import.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Test native GUI paths and make all-neuron views and numeric input scrollable and unrestricted'
          git push origin HEAD:refs/heads/test/jneuro-gui-regressions
