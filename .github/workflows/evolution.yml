name: Evolution Java 27

on:
  push:
    branches: [main]
    paths:
      - 'evolution/**'
      - 'build.gradle'
      - '.github/workflows/evolution.yml'
  pull_request:
    paths:
      - 'evolution/**'
      - 'build.gradle'
      - '.github/workflows/evolution.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Evolution
        run: ./gradlew --no-daemon :evolution:check
      - name: JMH smoke
        run: ./gradlew --no-daemon :evolution:jmhSmoke
      - name: Performance matrix smoke
        run: ./gradlew --no-daemon :evolution:performanceMatrix -PevolutionMatrixGenerations=10
      - name: Run example
        run: ./gradlew --no-daemon :evolution:runExperiment
