name: Pi dashboard browser regressions

on:
  push:
    paths:
      - 'picontroller/**'
      - '.github/workflows/picontroller-web.yml'
  pull_request:
    paths:
      - 'picontroller/**'
      - '.github/workflows/picontroller-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: picontroller/web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: picontroller/web-tests/package-lock.json
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Browser paths and security regressions in a real browser window
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm test
        env:
          HEADLESS: 'false'
      - name: Browser reports and diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picontroller-browser-results
          path: picontroller/web-tests/test-results/
          if-no-files-found: error
