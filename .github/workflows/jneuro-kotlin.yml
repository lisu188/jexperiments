name: JNeuro Kotlin migration

on:
  push:
    branches: [feature/jneuro-kotlin-ux]
    paths:
      - '.github/workflows/jneuro-kotlin.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/feature/jneuro-kotlin-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/jneuro-kotlin-ux
          fetch-depth: 0
      - name: Verify and apply migration source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.github/neuro-migration-{i}.b64').read_text() for i in range(5))
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'd1a758668f5f27c62f0eceebec517c224cd7785a767f1ef10465848b7122a93b'
          manifest = json.loads(lzma.decompress(packed))
          assert manifest['base'] == '75f8d619975bca7d2cbac141fc8bfaff2d8ff03d'
          def validate(name, expected):
              p = Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name in ('build.gradle', '.github/workflows/jneuro.yml') or name.startswith('jneuro/')
              assert not p.is_symlink() and not any(parent.is_symlink() for parent in p.parents)
              if expected is None:
                  assert not p.exists(), f'Unexpected existing file: {name}'
              else:
                  data = p.read_bytes()
                  actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  assert actual == expected, f'Concurrent edit: {name}'
          for name, entry in manifest['files'].items():
              validate(name, entry['expected'])
          for name, expected in manifest['deletes'].items():
              validate(name, expected)
          for name, entry in manifest['files'].items():
              if name.startswith('.github/workflows/'):
                  continue
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(entry['content'], encoding='utf-8')
          for name in manifest['deletes']:
              Path(name).unlink()
          print(f"Applied {len(manifest['files']) - 1} source/configuration files; removed {len(manifest['deletes'])} Java sources")
          PY
          git rm .github/neuro-migration-{0,1,2,3,4}.b64
          git add -- build.gradle jneuro
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Migrate all JNeuro sources to Kotlin 2.4.20 and redesign learning studio'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:refs/heads/feature/jneuro-kotlin-ux
          git log -1 --format='%H %s'
