name: ObservableConcurrentTree Java 27

on:
  push:
    paths:
      - 'observableconcurrenttree/**'
      - 'build.gradle'
      - 'blogsite/**'
      - 'gradle/wrapper/**'
      - '.github/workflows/observable-concurrent-tree.yml'
  pull_request:
    paths:
      - 'observableconcurrenttree/**'
      - 'build.gradle'
      - 'gradle/wrapper/**'
      - '.github/workflows/observable-concurrent-tree.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 27
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify optimized tree
        run: ./gradlew --no-daemon :observableconcurrenttree:verifyExperiment

      - name: Run complete example
        run: ./gradlew --no-daemon :observableconcurrenttree:runExperiment

      - name: Build blog site
        run: ./gradlew --no-daemon :blogsite:build

      - name: Run full build
        run: ./gradlew --no-daemon clean build
