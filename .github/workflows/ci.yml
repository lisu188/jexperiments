name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java toolchains
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            27

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run full build
        run: ./gradlew --no-daemon clean build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: '**/build/reports/**'
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build blog image
        run: docker build --tag jexperiments:ci .
