name: JNeuro search review snapshot
on:
  push:
    branches: [feature/jneuro-architecture-search-complete]
    paths: ['.github/workflows/jneuro-search-review.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export source history for local verification
        run: git bundle create /tmp/jneuro-search-source.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: jneuro-search-source
          path: /tmp/jneuro-search-source.bundle
          retention-days: 1
