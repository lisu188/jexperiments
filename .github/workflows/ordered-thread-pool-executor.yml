name: OrderedThreadPoolExecutor Java 27

on:
  push:
    branches: [main]
    paths:
      - 'orderedthreadpoolexecutor/**'
      - 'build.gradle'
      - '.github/workflows/ordered-thread-pool-executor.yml'
  pull_request:
    paths:
      - 'orderedthreadpoolexecutor/**'
      - 'build.gradle'
      - '.github/workflows/ordered-thread-pool-executor.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify executor
        run: ./gradlew --no-daemon :orderedthreadpoolexecutor:check
      - name: JMH smoke
        run: ./gradlew --no-daemon :orderedthreadpoolexecutor:jmhSmoke
      - name: jcstress sanity
        run: ./gradlew --no-daemon :orderedthreadpoolexecutor:jcstress -PorderedJcstressMode=sanity
      - name: Performance matrix smoke
        run: ./gradlew --no-daemon :orderedthreadpoolexecutor:performanceMatrix -PorderedMatrixTasks=2000 -PorderedMatrixRepetitions=1
