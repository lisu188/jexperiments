name: Tesseract Viewer Android

on:
  push:
    branches:
      - feature/tesseract-viewer
    paths:
      - "tesseractviewer/**"
      - ".github/workflows/tesseract-viewer-android.yml"
  pull_request:
    paths:
      - "tesseractviewer/**"
      - ".github/workflows/tesseract-viewer-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Test, lint and build APK
        run: gradle -p tesseractviewer :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TesseractViewer-debug
          path: tesseractviewer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
