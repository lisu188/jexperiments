name: Tesseract Viewer Android

on:
  push:
    branches:
      - main
      - "feature/tesseract-*"
      - "release/tesseract-viewer-*"
    paths:
      - "tesseractviewer/**"
      - ".github/workflows/tesseract-viewer-android.yml"
  pull_request:
    paths:
      - "tesseractviewer/**"
      - ".github/workflows/tesseract-viewer-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Test, lint and build release APK
        run: gradle -p tesseractviewer :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon
      - name: Verify and package release APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose tesseractviewer/app/build/outputs/apk/release/app-release.apk
          cp tesseractviewer/app/build/outputs/apk/release/app-release.apk TesseractViewer-1.1.0-release.apk
          sha256sum TesseractViewer-1.1.0-release.apk > TesseractViewer-1.1.0-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TesseractViewer-release-1.1.0
          path: |
            TesseractViewer-1.1.0-release.apk
            TesseractViewer-1.1.0-release.apk.sha256
          if-no-files-found: error

  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Prepare main worktree
        run: |
          git fetch origin main
          git worktree add /tmp/jexperiments-main origin/main
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p screenshots
            gradle -p /tmp/jexperiments-main/tesseractviewer :app:assembleDebug --no-daemon
            adb install -r /tmp/jexperiments-main/tesseractviewer/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop experiments.tesseractviewer
            adb shell am start -W -n experiments.tesseractviewer/.MainActivity
            sleep 2
            adb exec-out screencap -p > screenshots/before-default.png
            adb shell input swipe 540 950 790 700 600
            sleep 1
            adb exec-out screencap -p > screenshots/before-rotated.png

            gradle -p tesseractviewer :app:assembleDebug --no-daemon
            adb install -r tesseractviewer/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop experiments.tesseractviewer
            adb shell am start -W -n experiments.tesseractviewer/.MainActivity
            sleep 2
            adb exec-out screencap -p > screenshots/after-default.png
            adb shell input swipe 540 950 790 700 600
            sleep 1
            adb exec-out screencap -p > screenshots/after-rotated.png
      - uses: actions/upload-artifact@v4
        with:
          name: TesseractViewer-ux-screenshots
          path: screenshots/*.png
          if-no-files-found: error
