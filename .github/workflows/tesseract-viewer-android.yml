name: Tesseract Viewer Android

on:
  push:
    branches:
      - main
      - feature/tesseract-viewer
      - "release/tesseract-viewer-*"
    paths:
      - "tesseractviewer/**"
      - ".github/workflows/tesseract-viewer-android.yml"
  pull_request:
    paths:
      - "tesseractviewer/**"
      - ".github/workflows/tesseract-viewer-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Test, lint and build release APK
        run: gradle -p tesseractviewer :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon
      - name: Verify and package release APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose tesseractviewer/app/build/outputs/apk/release/app-release.apk
          cp tesseractviewer/app/build/outputs/apk/release/app-release.apk TesseractViewer-1.0.0-release.apk
          sha256sum TesseractViewer-1.0.0-release.apk > TesseractViewer-1.0.0-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TesseractViewer-release-1.0.0
          path: |
            TesseractViewer-1.0.0-release.apk
            TesseractViewer-1.0.0-release.apk.sha256
          if-no-files-found: error
