name: Export Android APK Signer

on:
  push:
    branches:
      - build/speech-recorder-release
    paths:
      - .github/workflows/fetch-apksigner.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android Build Tools
        run: sdkmanager "build-tools;36.0.0"
      - name: Export apksigner
        run: cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Android-ApkSigner
          path: apksigner.jar
          if-no-files-found: error
