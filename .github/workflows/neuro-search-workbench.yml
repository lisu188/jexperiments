name: JNeuro search workbench
on:
  push:
    branches: [feature/jneuro-architecture-search]
    paths: ['.github/workflows/neuro-search-workbench.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/jneuro-architecture-search
          fetch-depth: 0
      - name: Validate and apply tested source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.github/neuro-search-change-{i}.b64').read_text().strip() for i in range(3))
          archive = base64.b64decode(encoded, validate=True)
          expected = 'de5daf4042f19beb50aa7a66bc6a44d6d343d4abcdcfc61750aaf49e5e0343e9'
          assert hashlib.sha256(archive).hexdigest() == expected, 'Source transport checksum mismatch'
          patch = lzma.decompress(archive)
          assert len(patch) == 123866
          Path('/tmp/neuro-search.patch').write_bytes(patch)
          PY
          git apply --check /tmp/neuro-search.patch
          git apply --index /tmp/neuro-search.patch
          rm .github/neuro-search-change-{0,1,2}.b64 .github/workflows/neuro-search-workbench.yml
          git add -A -- jneuro .github/neuro-search-change-0.b64 .github/neuro-search-change-1.b64 .github/neuro-search-change-2.b64 .github/workflows/neuro-search-workbench.yml
          git diff --cached --check
          git config user.name 'Andrzej Lis'
          git config user.email '7967861+lisu188@users.noreply.github.com'
          git commit -m 'Add multi-seed architecture search and Pareto Studio workflow'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:feature/jneuro-architecture-search
