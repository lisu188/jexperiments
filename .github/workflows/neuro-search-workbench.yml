name: JNeuro search workbench
on:
  push:
    branches: [feature/jneuro-architecture-search]
    paths: ['.github/workflows/neuro-search-workbench.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: git archive --format=zip HEAD -o /tmp/jneuro-search-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jneuro-search-source
          path: /tmp/jneuro-search-source.zip
          retention-days: 1
