name: JNeuro TensorFlow Windows CPU
on:
  pull_request:
    paths: ['jneuro/**', 'build.gradle', '.github/workflows/jneuro-tensorflow.yml']
  push:
    branches: [main]
    paths: ['jneuro/**', 'build.gradle', '.github/workflows/jneuro-tensorflow.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jneuro-tensorflow-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify TensorFlow CPU math, lifecycle and coverage
        shell: pwsh
        run: ./gradlew.bat --no-daemon :jneuro:check :jneuro:jacocoTestReport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jneuro-tensorflow-windows
          path: |
            jneuro/build/reports/**
            jneuro/build/test-results/test/**
          retention-days: 7
          if-no-files-found: error
