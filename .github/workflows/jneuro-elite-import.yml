name: Import verified JNeuro elite selection
on:
  push:
    branches: [fix/jneuro-elite-parent-selection]
    paths: ['.github/workflows/jneuro-elite-import.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/fix/jneuro-elite-parent-selection'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/jneuro-elite-parent-selection
      - name: Apply the exact tested source patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          encoded = Path('.github/jneuro-elite-change.b64').read_text().strip()
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '30319776b0c0ee42a7141ce1bb91e59f440e51f5e8a8fa149c93657d7f53740d'
          Path('/tmp/elite.patch').write_bytes(patch)
          PY
          git apply --check /tmp/elite.patch
          git apply --index /tmp/elite.patch
          git rm .github/jneuro-elite-change.b64
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Select evolutionary parents by fitness from the current elite pool'
          git push origin HEAD:refs/heads/fix/jneuro-elite-parent-selection
