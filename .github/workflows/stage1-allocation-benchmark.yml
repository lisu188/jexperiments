name: Stage1 allocation benchmark comparison

on:
  push:
    paths:
      - '.github/workflows/stage1-allocation-benchmark.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out optimized branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create main worktree
        run: git worktree add /tmp/jexperiments-main origin/main

      - name: Benchmark main baseline
        working-directory: /tmp/jexperiments-main
        run: >
          ./gradlew --no-daemon :observableconcurrenttree:benchmarkMatrixExperiment
          -PtreeBenchmarkNodes=50000
          -PtreeBenchmarkRepetitions=7
          | tee /tmp/baseline.txt

      - name: Benchmark optimized branch
        run: >
          ./gradlew --no-daemon :observableconcurrenttree:benchmarkMatrixExperiment
          -PtreeBenchmarkNodes=50000
          -PtreeBenchmarkRepetitions=7
          | tee /tmp/optimized.txt

      - name: Show comparison inputs
        run: |
          echo '===== MAIN BASELINE ====='
          cat /tmp/baseline.txt
          echo '===== STAGE1 OPTIMIZED ====='
          cat /tmp/optimized.txt
