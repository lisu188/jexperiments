name: Export JNeuro elite-selection baseline
on:
  push:
    branches: [fix/jneuro-elite-parent-selection]
    paths: ['.github/workflows/jneuro-elite-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git bundle create /tmp/jneuro-elite-source.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: jneuro-elite-source
          path: /tmp/jneuro-elite-source.bundle
          retention-days: 1
