name: Static analysis

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    uses: ./.github/workflows/reusable-static-analysis.yml
    with:
      run_codeql: false
    permissions:
      contents: read
      security-events: write
