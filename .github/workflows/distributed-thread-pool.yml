name: DistributedThreadPool Java 27

on:
  push:
    branches: [main]
    paths:
      - 'distributedthreadpool/**'
      - 'build.gradle'
      - '.github/workflows/distributed-thread-pool.yml'
  pull_request:
    paths:
      - 'distributedthreadpool/**'
      - 'build.gradle'
      - '.github/workflows/distributed-thread-pool.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify distributed pool
        run: ./gradlew --no-daemon :distributedthreadpool:check
      - name: JMH smoke
        run: ./gradlew --no-daemon :distributedthreadpool:jmhSmoke
      - name: jcstress sanity
        run: ./gradlew --no-daemon :distributedthreadpool:jcstress -PdistributedJcstressMode=sanity
      - name: Performance matrix smoke
        run: ./gradlew --no-daemon :distributedthreadpool:performanceMatrix -PdistributedMatrixRequests=500 -PdistributedMatrixRepetitions=1
